name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (ESM CLI)
        run: npm run build

  windows-app:
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (portable EXE)
        run: npm run package:win

      - name: Create source archive
        run: |
          git archive --format=zip --output release/source-code.zip HEAD

      - name: Bundle release zip
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1 -ExpandProperty FullName
          Compress-Archive -Path $exePath, release/source-code.zip `
            -DestinationPath release/bodyslide-converter-release.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bodyslide-converter-release
          path: release/bodyslide-converter-release.zip

